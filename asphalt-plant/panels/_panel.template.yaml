# Template — copy into panels/<panel-name>/panel.yaml and edit.
# Anything left blank or TBD shows up in unknowns.md.
#
# Top-level fields:
#   name              # panel name as labeled in the field
#   manufacturer
#   model
#   voltage           # e.g. "480/277V" or "240/120V" or "208/120V"
#   phase             # 1 or 3
#   wire              # 3 or 4
#   mains_amps        # main breaker / bus rating
#   fed_from          # upstream source (utility, transformer tag, etc.)
#   location_room
#   location_zone
#   verified          # true after panel itself confirmed in person
#   notes
#
# breakers: list of entries, one per breaker position.
#   position          # "1" or "1,3,5" for a 3-pole; whatever the schedule shows
#   poles             # 1 / 2 / 3
#   trip_amps
#   frame             # frame size if known (e.g. "100AF")
#   model             # breaker model number
#   conductor         # wire size if known (e.g. "#10 cu THHN")
#   load_served       # tag or description of the load
#   status            # active | spare | removed | planned
#   verified          # true if the breaker was visually confirmed
#   notes

name: "PANEL-NAME"
manufacturer:
model:
voltage:
phase:
wire:
mains_amps:
fed_from:
location_room:
location_zone:
verified: false
notes: ""

breakers: []
